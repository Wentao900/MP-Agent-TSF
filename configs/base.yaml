experiment:
  name: baseline
  seed: 42
  output_root: outputs

# 仅 Parquet；须先运行 scripts/build_datasets.py（见 docs/EXPERIMENT_DATA_GUIDE.md）
data:
  source: parquet
  aligned_parquet: data/processed/aligned_daily_multimodal.parquet
  labels_parquet: data/processed/labels_trading.parquet
  holdout_aligned_parquet: data/processed/holdout_aligned_daily.parquet
  holdout_labels_parquet: data/processed/holdout_labels_trading.parquet
  splits_json: data/metadata/splits.json
  timestamp_col: Date
  symbol_col: ticker
  split_col: split
  split_mode: column
  regime_col: market_regime
  seq_len: 60
  prediction_horizon: 1
  market_state_window: 60
  buy_threshold: 0.005
  sell_threshold: -0.005
  fit_scaler_on_train: true
  eval_holdout: true
  val_start_date: "2023-01-01"
  test_start_date: "2024-01-01"

features:
  price_cols:
    - ret_1d
    - ret_5d
    - ret_20d
    - log_ret_1d
    - momentum_20
    - momentum_60
    - volatility_20
    - volatility_60
    - ma_gap_20
    - ma_gap_60
    - volume_chg_20
    - hl_range
    - oc_gap
    - FEDFUNDS
    - CPIAUCSL
    - UNRATE
    - DGS10
    - DGS2
    - T10Y2Y
    - VIXCLS
  text_cols:
    - text_emb_0
    - text_emb_1
    - text_emb_2
    - text_emb_3
    - text_emb_4
    - text_emb_5
    - text_emb_6
    - text_emb_7
    - text_emb_8
    - text_emb_9
    - text_emb_10
    - text_emb_11
    - text_emb_12
    - text_emb_13
    - text_emb_14
    - text_emb_15
    - text_emb_16
    - text_emb_17
    - text_emb_18
    - text_emb_19
    - text_emb_20
    - text_emb_21
    - text_emb_22
    - text_emb_23
    - text_emb_24
    - text_emb_25
    - text_emb_26
    - text_emb_27
    - text_emb_28
    - text_emb_29
    - text_emb_30
    - text_emb_31

model:
  hidden_dim: 64
  memory_dim: 32
  num_actions: 3
  reflector_k: 15

train:
  batch_size: 64
  epochs: 3
  lr: 0.001
  weight_decay: 0.0001
  sequence_len: 1
  use_trajectory_unroll: false
  lambda_act: 1.0
  lambda_pred: 0.3
  lambda_exp: 0.1
  lambda_smooth: 0.05
  lambda_reflect_corr: 0.1
  lambda_exp_faith: 0.1
  lambda_exp_stability: 0.1
  exp_perturb_ratio: 0.15
  reward_norm_scale: 100.0

backtest:
  initial_cash: 100000.0
  fee_rate: 0.0005
  slippage_rate: 0.0005
  max_position: 1.0
  use_label_rewards: true
